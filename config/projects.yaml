# =====================================================
# Project data displayed on the Projects page.
#
# Each item:
#   - `id`: unique identifier (lowercase, no spaces).
#   - `title`: project name.
#   - `summary`: one or two sentences (shown on the homepage card).
#   - `details`: longer description (shown on the Projects page).
#   - `partner`: industrial partner / funder ({ name, url }) — url may be null.
#   - `years`: time span.
#   - `topic`: category used by the filter on the Projects page.
#   - `tools`: list of tools used (shown as tags).
#   - `links`: optional list of { name, url } (media, papers, ...).
#   - `previewImage`: optional image URL (or "/images/..." for files in /public/images), or null.
#   - `icon`: react-icons icon shown when there is no preview image.
#   - `featured`:
#       true  → shown on the homepage
#       false → shown only on the Projects page
# =====================================================

