  # you can use HTML syntax here (e.g. <br/>, <a>, <strong>, ...)
  biography: |
    I am an electrical drives and power electronics researcher at <strong>Newcastle University</strong>, with experience from grid-scale generators (<a href="https://ieeexplore.ieee.org/document/10110941" target="_blank" rel="noopener noreferrer">&gt;10 MW</a>) to <a href="https://ieeexplore.ieee.org/abstract/document/10700390" target="_blank" rel="noopener noreferrer">ultra-high-speed miniature electrical machines</a> (100 W, 100 krpm) and <a href="https://www.defenceturkey.com/en/content/muzzle-energy-record-from-tufan-electromagnetic-railgun-system-3845" target="_blank" rel="noopener noreferrer">pulsed-power electromagnetic launchers</a>.
    <div class="my-2"></div>
    My PhD thesis in the <a href="https://research.ncl.ac.uk/electric-propulsion/" target="_blank" rel="noopener noreferrer">Sustainable Electrical Propulsion CDT</a>, in partnership with <strong>Dyson</strong>, is <em>Current Source Inverters for Ultra-High Speed Electrical Machines</em>. I have designed and experimentally tested gallium nitride (GaN)- and bidirectional GaN (BiGaN)-based CSI prototypes, including work with first engineering samples of BiGaN devices, as well as sensorless motor-drive algorithms and modulation methods for high-speed motor drives. This work includes a &gt;400 krpm sensorless drive that broke the world record for the <em>n</em>&radic;<em>P</em> metric and the world's first BiGaN-based high-speed motor drive.
    <div class="my-2"></div>
    I currently work on the EPSRC <a href="https://www.aimd.ac.uk/" target="_blank" rel="noopener noreferrer">Advanced Integrated Motor Drive Technologies</a> project and the DIRECT project on dynamically reconfigurable power converters for net-zero distribution systems. Before Newcastle, I was a research engineer at <a href="https://odtu.github.io/" target="_blank" rel="noopener noreferrer">METU PowerLab</a>, working on 10 MJ electromagnetic launchers, hydro-generator refurbishment, and PV converter design.
    <div class="my-2"></div>
    Email is the best way to <a href="mailto:n.tosun2@newcastle.ac.uk">reach me</a> for research collaborations, publications, and project enquiries.

