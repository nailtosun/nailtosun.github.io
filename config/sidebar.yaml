# =====================================================
# Sidebar Layout Configuration
#
# - The order of sections below determines their display order in the sidebar.
# - To remove a page from the sidebar, simply delete the corresponding item.
# =====================================================

sidebar:
  userName: "Nail Tosun" # Name displayed at the top of the sidebar
  initials: "NT" # Shown if the profile image fails to load
  profileImage: "/images/nail_tosun.jpg" # Profile image URL
  sections:
    - title: About Me
      url: ""
      icon:
        name: LuUser
        package: "react-icons/lu"

    - title: Publications
      url: "publications"
      icon:
        name: LuLibraryBig
        package: "react-icons/lu"

    - title: Projects
      url: "projects"
      icon:
        name: LuWrench
        package: "react-icons/lu"
