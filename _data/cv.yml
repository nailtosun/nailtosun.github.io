- title: Selected Projects
  type: time_table
  contents:
    - title: CSI Motor Drives for Ultra-High-Speed Electrical Machines
      institution: Industrial partner - Dyson
      year: Sep 2023 - present
      description:
        - "Tools: Altium, PLECS, SPICE, MATLAB/Simulink, C2000 MCUs."
        - Designed GaN and bidirectional GaN CSI hardware, including board design, switching-loss evaluation, and C2000 MCU software development.
        - Performed high-speed machine loss analysis and experimental validation with 100 krpm motors.
        - Developed modulation and sensorless motor-control methods for ultra-high-speed machine operation.
        - Compared CSI and voltage source inverter topologies using virtual prototypes and detailed design models.
    - title: Design and Analysis of Electromagnetic Launchers
      institution: Industrial partner - <a href="https://www.aselsan.com/en">ASELSAN Inc.</a>
      year: Sep 2019 - Sep 2022
      description:
        - "Tools: COMSOL Multiphysics, MATLAB."
        - Designed and optimized railgun components and pulse power supply systems.
        - Developed multiphysics FEM models and improved agreement between experimental tests and simulations.
        - Investigated velocity skin effect and lamination modeling for computationally challenging launcher phenomena.
    - title: Refurbishment of 70+ Year Old Hydroelectric Power Plant
      institution: Industrial partner - <a href="https://www.euas.gov.tr/en-US">EUAS</a>
      year: Sep 2021 - Sep 2023
      description:
        - "Tools: ANSYS Maxwell, COMSOL Multiphysics."
        - Supported lifetime extension of ageing hydroelectric generators.
        - Improved efficiency by 0.2 percent, corresponding to approximately 100 kW loss reduction.
        - Supported conversion from diamond coils to Roebel bars and updated generator slot number and geometry.
    - title: 20 kW DC-DC Converter Design for 160 kW String PV Inverter
      institution: TUBITAK 1004
      year: Sep 2021 - Sep 2022
      description:
        - "Tools: COMSOL Multiphysics, MATLAB."
        - Used optimization algorithms to design inductors for DC-DC converters.
        - Developed PWM loss models and coupled thermal-electromagnetic FEM computations.
    - title: Solar Power Generation Analysis and Forecasting Using ANNs
      institution: Middle East Technical University
      year: May 2018 - May 2019
      description:
        - "Tools: Python, TensorFlow."
        - Developed models targeting reliability challenges in solar power generation.
        - Applied machine learning models to cost-effective solar power forecasting.

